<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="color-scheme" content="light dark">
  <title>KeyBridge · 入力専用</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <script src="{{ url_for('static', filename='app.js') }}" defer></script>
</head>
<body class="input-only">
  <main aria-label="定型入力">
    <div id="macros" class="compact-grid" aria-label="マクロ" aria-busy="true"></div>
    <p id="empty" hidden>登録されているマクロがありません。</p>
    <noscript><p>この操作画面にはJavaScriptが必要です。</p></noscript>
  </main>
  <p id="message" class="toast" role="status" aria-live="polite" aria-atomic="true" data-visible="true">マクロを読み込み中…</p>
</body>
</html>
